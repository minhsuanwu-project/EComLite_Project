services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecomlite-db
    environment:
      SA_PASSWORD: "EComLite_Pass123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - ecomlite-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost",
             "-U", "sa",
             "-P", "EComLite_Pass123",
             "-Q", "SELECT 1",
             "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecomlite-app
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: >
        Server=db,1433;
        Database=EComLite;
        User Id=sa;
        Password=EComLite_Pass123;
        TrustServerCertificate=True;
        MultipleActiveResultSets=True;
    depends_on:
      db:
        condition: service_healthy

volumes:
  ecomlite-sqldata:
